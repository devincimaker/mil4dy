[project]
name = "mil4dy"
version = "0.2.0"
description = "Turn folders of MP3s into an analyzed, planned, professionally rendered offline DJ mix."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "librosa>=0.11",
    "torch>=2.3",
    "torchaudio",
    "beat-this==1.1.0",
    "essentia==2.1b6.dev1389",
    "soundfile>=0.12",
    "soxr>=0.3",
    "pyloudnorm>=0.1.1",
    "numba>=0.59",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
debug = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mil4dy = "mil4dy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mil4dy"]
